<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STOCK MANAGER PRO</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  .form {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  input, select, button {
    padding: 8px;
    font-size: 14px;
  }

  button {
    cursor: pointer;
    background: #4caf50;
    border: none;
    color: white;
  }

  .product {
    background: #222;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 4px;
  }

  .low-stock {
    background: #442222;
  }

  #totalValue {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>STOCK MANAGER PRO</h1>

<div class="form">
  <input id="name" placeholder="Product name">

  <input id="quantity" placeholder="Quantity">

  <select id="unit">
    <option value="pcs" selected>pcs</option>
    <option value="ctn">ctn</option>
    <option value="kg">kg</option>
    <option value="lb">lb</option>
    <option value="oz">oz</option>
  </select>

  <input id="price" placeholder="Price (€)">

  <button onclick="addProduct()">Add Product</button>
</div>

<div id="productList"></div>

<div id="totalValue"></div>

<script>
let products = JSON.parse(localStorage.getItem('products') || "[]");

function cleanNumber(value, allowDecimal = true) {
  value = value.trim().replace(/\s/g, '');

  if (allowDecimal) {
    value = value.replace(/\./g, '');
    value = value.replace(',', '.');
  } else {
    value = value.replace(/\D/g, '');
  }

  return value;
}

function formatNumber(value, decimals) {
  return new Intl.NumberFormat('it-IT', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  }).format(value);
}

function renderProducts() {
  const list = document.getElementById('productList');
  list.innerHTML = "";

  let totalValue = 0;

  products.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = "product";

    if ((p.unit === "pcs" || p.unit === "ctn") && p.quantity < 5) {
      div.classList.add("low-stock");
    }

    const value = p.quantity * p.price;
    totalValue += value;

    const qtyDecimals = (p.unit === "pcs" || p.unit === "ctn") ? 0 : 2;

    div.innerHTML = `
      <strong>${p.name}</strong><br>
      Quantity: ${formatNumber(p.quantity, qtyDecimals)} ${p.unit}<br>
      Price: €${formatNumber(p.price, 2)}<br>
      Value: €${formatNumber(value, 2)}
      <br>
      <button onclick="deleteProduct(${i})">Delete</button>
    `;

    list.appendChild(div);
  });

  document.getElementById('totalValue').innerText =
    "Total Inventory Value: €" + formatNumber(totalValue, 2);
}

function addProduct() {
  const name = document.getElementById('name').value.trim();
  const unit = document.getElementById('unit').value;

  const quantityInput = document.getElementById('quantity').value;
  const priceInput = document.getElementById('price').value;

  const allowDecimal = !(unit === "pcs" || unit === "ctn");

  const quantityClean = cleanNumber(quantityInput, allowDecimal);
  const priceClean = cleanNumber(priceInput, true);

  const quantity = allowDecimal ? parseFloat(quantityClean) : parseInt(quantityClean);
  const price = parseFloat(priceClean);

  if (!name || isNaN(quantity) || isNaN(price)) {
    alert("Please insert valid data.");
    return;
  }

  products.push({ name, unit, quantity, price });
  localStorage.setItem('products', JSON.stringify(products));
  renderProducts();

  document.getElementById('name').value = "";
  document.getElementById('quantity').value = "";
  document.getElementById('price').value = "";
}

function deleteProduct(index) {
  products.splice(index, 1);
  localStorage.setItem('products', JSON.stringify(products));
  renderProducts();
}

renderProducts();
</script>

</body>
</html>
