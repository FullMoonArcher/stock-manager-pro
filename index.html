<!DOCTYPE html>
<html>
<head>
  <title>Stock Manager Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; }
    .product { background: white; padding: 10px; margin-top: 10px; border-radius: 5px; }
  </style>
</head>
<body>

<h1>STOCK MANAGER PRO</h1>

<input type="text" id="name" placeholder="Product name">
<input type="number" id="quantity" placeholder="Quantity">
<input type="number" id="price" placeholder="Price">

<button onclick="addProduct()">Add Product</button>

<div id="productList"></div>

<script>
  function addProduct() {
    const name = document.getElementById('name').value;
    const quantity = document.getElementById('quantity').value;
    const price = document.getElementById('price').value;

    if (!name) return;

    const productDiv = document.createElement('div');
    productDiv.className = "product";
    productDiv.innerHTML = `<strong>${name}</strong><br>
                            Quantity: ${quantity}<br>
                            Price: €${price}`;

    document.getElementById('productList').appendChild(productDiv);

    document.getElementById('name').value = "";
    document.getElementById('quantity').value = "";
    document.getElementById('price').value = "";
  }
</script>

</body>
</html>
