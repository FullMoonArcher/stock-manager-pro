<script>
  let products = JSON.parse(localStorage.getItem('products') || "[]");

  function renderProducts() {
    const list = document.getElementById('productList');
    list.innerHTML = "";
    let totalValue = 0;

    products.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = "product";

      // Evidenzia prodotti con scorte basse (<5)
      if (Number(p.quantity) < 5) {
        div.style.background = "#ffdddd";
      }

      const value = Number(p.quantity) * Number(p.price);
      totalValue += value;

      div.innerHTML = `<strong>${p.name}</strong><br>
                       Quantity: ${p.quantity}<br>
                       Price: €${p.price} <br>
                       Value: €${value.toFixed(2)} 
                       <button onclick="deleteProduct(${i})">Delete</button>`;
      list.appendChild(div);
    });

    document.getElementById('totalValue').innerText = "Total Inventory Value: €" + totalValue.toFixed(2);
  }

  function addProduct() {
    const name = document.getElementById('name').value;
    const quantity = document.getElementById('quantity').value;
    const price = document.getElementById('price').value;
    if (!name || !quantity || !price) return;

    products.push({name, quantity, price});
    localStorage.setItem('products', JSON.stringify(products));
    renderProducts();

    document.getElementById('name').value = "";
    document.getElementById('quantity').value = "";
    document.getElementById('price').value = "";
  }

  function deleteProduct(index) {
    products.splice(index,1);
    localStorage.setItem('products', JSON.stringify(products));
    renderProducts();
  }

  renderProducts();
</script>
